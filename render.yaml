# Blueprint do Render para a API (coloque na raiz do repositório).
services:
  - type: web
    name: saudeplus-api
    runtime: python
    plan: free
    buildCommand: pip install -r src/requirements.txt
    startCommand: uvicorn saudeplus.main:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_API_KEY
        sync: false
      - key: SAUDEPLUS_CORS
        value: "*"   # troque pela URL do front na Vercel depois do primeiro deploy
